services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    # Uncomment if the existing MySQL instance runs on the Vultr host itself
    # (outside this compose network) rather than in its own container:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # If the bot's MySQL database is not already running elsewhere, run it
